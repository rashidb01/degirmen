<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Degirmen — электронное меню</title>
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-row">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo-full.png" alt="Degirmen" />
        <div class="brand-tagline">электронное меню</div>
      </div>
    </div>
    <nav class="category-nav" id="categoryNav" aria-label="Категории меню"></nav>
  </header>

  <section class="hero">
    <div class="search-box">
      <span>🔎</span>
      <input type="text" id="searchInput" placeholder="Найти блюдо…" />
    </div>
  </section>

  <main class="menu-wrap" id="menuWrap">
    <div class="empty-state">Загружаем меню…</div>
  </main>

  <footer class="site-footer">
    <div>Degirmen · электронное меню и приём заказов</div>
    <div class="roadmap">Скоро: оплата через Kaspi и синхронизация заказов с R-Keeper</div>
  </footer>

  <!-- Dish detail modal -->
  <div class="overlay" id="dishOverlay">
    <div class="modal-card" id="dishModal"></div>
  </div>

  <!-- Cart drawer -->
  <div class="overlay" id="cartOverlay" style="align-items:stretch; justify-content:flex-end;">
    <aside class="drawer" id="cartDrawer">
      <div class="drawer-header">
        <h3>Ваш заказ</h3>
        <button class="drawer-close" id="cartCloseBtn" type="button">✕</button>
      </div>
      <div class="drawer-body" id="cartBody"></div>
      <div class="drawer-footer hidden" id="cartFooter">
        <div class="cart-total-row"><span>Итого</span><span id="cartTotal">0 ₸</span></div>
        <button class="btn-primary" id="checkoutBtn" type="button" style="width:100%">Оформить заказ</button>
        <div class="payment-note">Оплата на кассе · онлайн-оплата через Kaspi скоро появится</div>
      </div>
    </aside>
  </div>

  <!-- Idle nudge bubble -->
  <div class="idle-nudge hidden" id="idleNudge">
    <button class="idle-nudge-close" id="idleNudgeClose" type="button" aria-label="Закрыть">✕</button>
    <div class="idle-nudge-text">Помочь вам с выбором? 👋</div>
    <button class="idle-nudge-btn" id="idleNudgeBtn" type="button">Да, помогите</button>
  </div>

  <!-- Floating action buttons -->
  <div class="fab-row">
    <button class="fab cart-toggle" id="cartBtn" type="button" aria-label="Открыть корзину">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-count hidden" id="cartCount">0</span>
    </button>
    <button class="fab chat-toggle" id="chatToggle" type="button" aria-label="Открыть чат-помощника">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="dot"></span>
    </button>
  </div>

  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <img src="/assets/logo-icon.png" alt="" />
      <div>
        <div class="title">Помощник Degirmen</div>
        <div class="subtitle">Спросите про блюда, аллергены, замену</div>
      </div>
      <div class="chat-header-spacer"></div>
      <button class="chat-close" id="chatCloseBtn" type="button">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-suggestions" id="chatSuggestions"></div>
    <form class="chat-input-row" id="chatForm">
      <input type="text" id="chatInput" placeholder="Напишите сообщение…" autocomplete="off" />
      <button type="submit" aria-label="Отправить">➤</button>
    </form>
    <div class="chat-notice" id="chatNotice"></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
